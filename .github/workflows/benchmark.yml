name: Filesystem Benchmark (Rust vs Java vs Native C)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Benchmarks
        run: |
          echo "=== Compiling Rust (Release) ==="
          cargo build --release
          
          echo "=== Compiling Java ==="
          javac JavaFileBenchmark.java

          echo "=== Compiling Native C (GCC -O3) ==="
          gcc -O3 native_benchmark.c -o native_bench

      - name: Create Test Synthetic Heavy Directory (10,000 files)
        run: |
          mkdir -p test_dir
          echo "Creating 10,000 files for benchmark..."
          for i in $(seq 1 10000); do
            echo "benchmark data content $i" > "test_dir/file_$i.txt"
          done
          echo "Created 10,000 test files."

      - name: Run Side-by-Side Benchmarks
        run: |
          echo "=================================================="
          echo "       LIVE FILESYSTEM BENCHMARK RESULTS         "
          echo "=================================================="
          
          echo ""
          echo "--- RUNNING JAVA JVM BENCHMARK ---"
          java JavaFileBenchmark test_dir
          
          echo ""
          echo "--- RUNNING NATIVE C BENCHMARK ---"
          ./native_bench test_dir

          echo ""
          echo "--- RUNNING RUST BENCHMARK ---"
          ./target/release/rust_fs_benchmark test_dir
          
          echo ""
          echo "=================================================="
