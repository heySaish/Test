name: SSH Server Test

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH server and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server sshpass

      - name: Configure SSH
        run: |
          sudo mkdir -p /run/sshd

          # Create temporary test user
          sudo useradd -m -s /bin/bash testssh
          echo 'testssh:test123' | sudo chpasswd

          # Make sure password authentication is enabled
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/test.conf

          # Validate configuration
          sudo sshd -t

      - name: Start SSH server
        run: |
          sudo /usr/sbin/sshd

      - name: Verify SSH listener
        run: |
          echo "=== Listening on port 22 ==="
          sudo ss -lntp | grep ':22'

      - name: Test SSH connection
        run: |
          sshpass -p 'test123' ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            testssh@localhost \
            'echo "🔥 SSH WORKS INSIDE RUNNER"; echo "User: $(whoami)"; echo "Host: $(hostname)"'

      - name: SSH server status
        if: always()
        run: |
          echo "=== SSH processes ==="
          pgrep -a sshd || true

          echo "=== Port 22 ==="
          sudo ss -lntp | grep ':22' || true

      - name: Keep runner alive briefly
        run: |
          echo "SSH test completed."
          sleep 30
