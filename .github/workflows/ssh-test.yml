name: Termux SSH via Pinggy

on:
  workflow_dispatch:

jobs:
  pinggy-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Server
        run: |
          # Missing directory fix
          sudo mkdir -p /run/sshd
          sudo chmod 0755 /run/sshd

          # Runner password set karo
          echo 'runner:voidpass123' | sudo chpasswd

          # Password login enable
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/termux.conf

          # Host keys verify & sshd start
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd

      - name: Start Pinggy Tunnel & Print Connect Command
        run: |
          # Reverse tunnel start in background
          ssh -p 443 -R0:localhost:22 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o TCPKeepAlive=yes \
            a.pinggy.io > pinggy.log 2>&1 &

          # Tunnel connect hone ka intezar
          sleep 7

          echo "=========================================="
          echo "🔥 TERA PINGGY SSH COMMAND 🔥"
          echo "=========================================="
          
          # Exact command extract karke print karo
          SSH_CMD=$(grep -o 'ssh -p [0-9]* [^ ]*' pinggy.log | head -n 1)
          if [ -n "$SSH_CMD" ]; then
            echo "$SSH_CMD" | sed 's/ssh /ssh runner@/'
          else
            cat pinggy.log
          fi
          
          echo "=========================================="
          echo "Password: voidpass123"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          echo "Runner connected! Terminal ready hai 😈"
          # 6 ghante tak active rahega
          sleep 21600

