name: Termux SSH via Pinggy

on:
  workflow_dispatch:

jobs:
  pinggy-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Runner Password
        run: |
          # Default runner user ka password set kiya
          echo 'runner:voidpass123' | sudo chpasswd
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/termux.conf
          sudo sshd -t
          sudo systemctl restart ssh || sudo /usr/sbin/sshd

      - name: Start Pinggy Tunnel & Print Connect Command
        run: |
          # Pinggy reverse tunnel background me chalu
          ssh -p 443 -R0:localhost:22 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o TCPKeepAlive=yes \
            a.pinggy.io > pinggy.log 2>&1 &

          # Tunnel URL aane ka wait
          sleep 6

          echo "=========================================="
          echo "🔥 TERA PINGGY SSH COMMAND 🔥"
          echo "=========================================="
          
          # Exact command filter karke print karo
          SSH_CMD=$(grep -o 'ssh -p [0-9]* [^ ]*' pinggy.log | head -n 1)
          if [ -n "$SSH_CMD" ]; then
            echo "$SSH_CMD" | sed 's/ssh/ssh runner@/'
          else
            cat pinggy.log
          fi
          
          echo "=========================================="
          echo "Password: voidpass123"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          echo "Session live hai! Connect kar aur mauj le 😈"
          # Max 6 hours tak runner zinda rahega (GitHub Actions limit)
          sleep 21600

