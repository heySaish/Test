name: Secure SSH Debugging with tmate

on:
  workflow_dispatch: # Taaki tu GitHub UI se manually 'Run workflow' par click karke start kar sake

jobs:
  debug-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix OpenSSH Privilege Separation Directory Error
        run: |
          echo "[-] OpenSSH configuration fix apply kar rahe hain..."
          # Privilege separation directory create karna aur sahi permissions set karna
          sudo mkdir -p /var/run/sshd /run/sshd
          sudo chmod 0755 /var/run/sshd /run/sshd
          sudo chown root:root /var/run/sshd /run/sshd
          echo "[+] Sahi directories set ho gayi hain!"

      - name: Setup tmate Session and Debug
        uses: mxschmitt/action-tmate@v3
        with:
          # (Optional) Sirf tere account ke liye access restrict karne ke liye (Security ke liye achha hai)
          limit-access-to-actor: true

