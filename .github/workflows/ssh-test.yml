name: SSH Debugging with Upterm

on:
  workflow_dispatch:

jobs:
  debug-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Upterm Session
        uses: owenthereal/action-upterm@v2
        with:
          wait-timeout-minutes: 15


